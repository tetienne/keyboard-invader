<!-- Renders public/og-image.jpg (1200x630). Run `pnpm dev`, open /tools/og-image.html and screenshot the canvas. -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="1200" height="630"></canvas>
    <script type="module">
      import '@fontsource/fredoka/latin-700.css'
      import { Background } from '/src/render/background.ts'
      import { WORLD_THEMES } from '/src/content/campaign.ts'
      import { drawAlien, drawShip, glowSprite, palette } from '/src/render/art.ts'
      import { Particles } from '/src/render/particles.ts'
      import { SHIPS } from '/src/content/ships.ts'

      await document.fonts.load('700 100px Fredoka')
      const W = 1200,
        H = 630
      const ctx = document.getElementById('c').getContext('2d')
      const bg = new Background()
      bg.setTheme(WORLD_THEMES[0])
      bg.resize(W, H)
      bg.update(0.016)
      bg.draw(ctx)

      const pose = (t, lx, ly, scared = false) => ({
        t,
        lookX: lx,
        lookY: ly,
        scared,
        blink: false,
        flash: 0,
      })
      function alien(x, y, r, species, pal, letter, t, scared) {
        ctx.save()
        ctx.translate(x, y)
        ctx.globalCompositeOperation = 'lighter'
        ctx.globalAlpha = 0.35
        ctx.drawImage(glowSprite(palette(pal).body), -r * 3, -r * 3, r * 6, r * 6)
        ctx.globalCompositeOperation = 'source-over'
        ctx.globalAlpha = 1
        ctx.save()
        ctx.scale(r, r)
        const dx = 600 - x,
          dy = 560 - y,
          d = Math.hypot(dx, dy)
        drawAlien(ctx, species, palette(pal), pose(t, dx / d, dy / d, scared))
        ctx.restore()
        const br = r * 0.62,
          by = r * 0.95
        ctx.beginPath()
        ctx.arc(0, by, br, 0, Math.PI * 2)
        ctx.fillStyle = '#fff'
        ctx.fill()
        ctx.lineWidth = br * 0.16
        ctx.strokeStyle = palette(pal).dark
        ctx.stroke()
        ctx.fillStyle = '#1b1033'
        ctx.font = `700 ${Math.round(br * 1.35)}px Fredoka`
        ctx.textAlign = 'center'
        ctx.textBaseline = 'middle'
        ctx.fillText(letter, 0, by + br * 0.06)
        ctx.restore()
      }

      // Laser + explosion on the right
      const ship = { x: 600, y: 560 }
      const target = { x: 930, y: 270 }
      ctx.save()
      ctx.globalCompositeOperation = 'lighter'
      ctx.lineCap = 'round'
      ctx.strokeStyle = '#5fd4ff'
      ctx.lineWidth = 12
      ctx.globalAlpha = 0.5
      ctx.beginPath()
      ctx.moveTo(ship.x + 20, ship.y - 50)
      ctx.lineTo(target.x, target.y)
      ctx.stroke()
      ctx.strokeStyle = '#fff'
      ctx.lineWidth = 4
      ctx.globalAlpha = 1
      ctx.stroke()
      ctx.restore()
      const p = new Particles()
      Math.random = (() => {
        let s = 7
        return () => (s = (s * 16807) % 2147483647) / 2147483647
      })()
      p.explosion(target.x, target.y, ['#ff7aa8', '#ffd6e5', '#ffffff'], 2.6)
      p.confetti(target.x, target.y, 40, 500)
      p.update(0.09)
      p.draw(ctx)

      alien(150, 150, 48, 0, 0, 'F', 0.3, false)
      alien(1070, 120, 44, 3, 3, 'J', 1.1, false)
      alien(165, 500, 44, 5, 4, 'D', 2.2, false)
      alien(1000, 470, 46, 1, 2, 'K', 0.8, true)

      // Ship
      ctx.save()
      ctx.translate(ship.x, ship.y)
      ctx.rotate(0.55)
      ctx.globalCompositeOperation = 'lighter'
      ctx.globalAlpha = 0.6
      ctx.drawImage(glowSprite('#ff5fa2'), -80, -70, 160, 160)
      ctx.globalAlpha = 1
      ctx.globalCompositeOperation = 'source-over'
      ctx.scale(46, 46)
      drawShip(ctx, SHIPS[0], 0)
      ctx.restore()

      // Logo
      function logo(text, y, size, stops, glow) {
        ctx.save()
        ctx.font = `700 ${size}px Fredoka`
        ctx.textAlign = 'center'
        ctx.textBaseline = 'middle'
        ctx.lineJoin = 'round'
        ctx.lineWidth = size * 0.16
        ctx.strokeStyle = '#1b1033'
        ctx.shadowColor = glow
        ctx.shadowBlur = 40
        ctx.strokeText(text, W / 2, y + size * 0.07)
        ctx.shadowBlur = 0
        const g = ctx.createLinearGradient(0, y - size / 2, 0, y + size / 2)
        stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c))
        ctx.fillStyle = g
        ctx.fillText(text, W / 2, y)
        ctx.restore()
      }
      logo('KEYBOARD', 205, 128, ['#fff7b0', '#ffd23f', '#ff7a1c'], 'rgba(255,160,40,0.8)')
      logo('INVADER', 330, 128, ['#e6fbff', '#5fd4ff', '#9b5cff'], 'rgba(95,212,255,0.8)')
      ctx.save()
      ctx.font = '700 34px Fredoka'
      ctx.textAlign = 'center'
      ctx.fillStyle = '#fff'
      ctx.lineWidth = 8
      ctx.lineJoin = 'round'
      ctx.strokeStyle = '#1b1033'
      const tag = 'Apprends à taper au clavier en t’amusant !'
      ctx.strokeText(tag, W / 2, 435)
      ctx.fillText(tag, W / 2, 435)
      ctx.restore()
      window.ogReady = true
    </script>
  </body>
</html>
